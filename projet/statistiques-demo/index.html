<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Aperçu des statistiques | Néotisse</title>
<style>
:root{--bg:#FBF0F1;--card:#fff;--fg:#2B211B;--mut:#7a6a63;--accent:#8A2A36;--line:#EBCFD3;--s1:#8A2A36;--s2:#B8613F;--s3:#D9A38F;--s4:#6E3927;--warn:#FFF4D6;--warnfg:#6b4a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241519;--card:#31201f;--fg:#f4e9e4;--mut:#bfa9a1;--accent:#e08a96;--line:#4a2f33;--s1:#e08a96;--s2:#e0906a;--s3:#a9715f;--s4:#c99a85;--warn:#3d3214;--warnfg:#f3d98a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241519;--card:#31201f;--fg:#f4e9e4;--mut:#bfa9a1;--accent:#e08a96;--line:#4a2f33;--s1:#e08a96;--s2:#e0906a;--s3:#a9715f;--s4:#c99a85;--warn:#3d3214;--warnfg:#f3d98a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(28px,5vw,42px);color:var(--accent);margin:0;text-wrap:balance}
.sub{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.demo{background:var(--warn);color:var(--warnfg);border-radius:12px;padding:10px 14px;font-size:13px}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0}
.card h2{font-size:13px;font-weight:500;color:var(--mut);margin:0 0 8px}
.big{font-family:Georgia,"Times New Roman",serif;font-size:40px;font-weight:600;color:var(--accent);line-height:1}
.delta{font-size:12px;color:var(--mut);margin-top:6px}
.row{grid-template-columns:2fr 1fr}
.row2{grid-template-columns:1fr 1fr}
@media(max-width:820px){.row,.row2{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block}
.leg{display:flex;flex-direction:column;gap:8px;font-size:13px;margin-top:10px}
.leg span{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.leg b{margin-left:auto;font-weight:600}
.bar{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;font-size:13px;margin:10px 0}
.bar div.t{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar div.t div{height:100%;background:var(--s1);border-radius:6px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{font:inherit;font-size:13px;letter-spacing:.04em;text-transform:capitalize;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;margin-left:8px;cursor:pointer}</style></head><body>
<div class="wrap">
<header><div><h1>Analytics Néotisse</h1></div><label class="sub" for="mois">Mois <select id="mois"></select></label></header>
<div class="grid kpis">
<div class="card"><h2>Visites du site</h2><div class="big" id="k0"></div><div class="delta" id="d0"></div></div>
<div class="card"><h2>Demandes d'atelier envoyées</h2><div class="big" id="k1"></div><div class="delta" id="d1"></div></div>
<div class="card"><h2>Clics « Demander un atelier »</h2><div class="big" id="k2"></div><div class="delta" id="d2"></div></div>
<div class="card"><h2>Avis envoyés</h2><div class="big" id="k3"></div><div class="delta" id="d3"></div></div>
</div>
<div class="grid row">
<div class="card"><h2>Visites par jour</h2><svg id="area" viewBox="0 0 700 260"></svg></div>
<div class="card"><h2>Sources du trafic</h2><svg id="donut" viewBox="0 0 200 200" style="max-width:220px;margin:auto"></svg><div class="leg" id="leg"></div></div>
</div>
<div class="grid row2">
<div class="card"><h2>Pages les plus vues</h2><div id="pages"></div></div>
<div class="card"><h2>Actions des visiteuses</h2><div id="acts"></div></div>
</div>
</div>
<script>
var MOIS=[['Juillet 2026',2026,6],['Août 2026',2026,7],['Septembre 2026',2026,8],['Octobre 2026',2026,9],['Novembre 2026',2026,10]];
var FACT=[.42,.55,.7,.85,1];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var BASE=[22,31,28,35,40,26,24,38,45,41,36,48,52,33,29,44,50,47,55,60,38,35,51,58,62,57,66,70,45,42,50];
function gen(m){var r=rng(m*97+13),n=new Date(MOIS[m][1],MOIS[m][2]+1,0).getDate(),f=FACT[m];
var d=[];for(var i=0;i<n;i++)d.push(Math.max(4,Math.round(BASE[i]*f*(.85+r()*.3))));
var tot=d.reduce(function(a,b){return a+b},0);
var sh=[46,24,18,12].map(function(x,i){return Math.max(5,Math.round(x+(r()-.5)*8))});var ss=sh.reduce(function(a,b){return a+b},0);sh=sh.map(function(x){return Math.round(x/ss*100)});sh[0]+=100-sh.reduce(function(a,b){return a+b},0);
var pw=[612,344,221,134,97,76].map(function(x){return Math.round(x*f*(.8+r()*.4)*tot/1284/f*f)});pw.sort(function(a,b){return b-a});
var clics=Math.round(tot*.075),dem=Math.round(tot*.018),avis=Math.round(tot*.007),ct=Math.round(tot*.032),ev=Math.round(tot*.026);
return{d:d,tot:tot,sh:sh,pw:pw,clics:clics,dem:dem,avis:avis,ct:ct,ev:ev}}
var DATA=MOIS.map(function(_,i){return gen(i)});
var PN=['Accueil','Ateliers','Nos créations',"Livre d'or",'Contact','Événements'];
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f')}
function area(d,mois){var W=700,H=260,p=28,mx=Math.ceil(Math.max.apply(null,d)/20)*20+20;
var pts=d.map(function(v,i){return[p+i*(W-2*p)/(d.length-1),H-p-v/mx*(H-2*p)]});
var line=pts.map(function(q,i){return(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(' ');
var g='';for(var t=0;t<=mx;t+=20){var y=H-p-t/mx*(H-2*p);g+='<line x1="'+p+'" x2="'+(W-p)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="0" y="'+(y+4)+'" font-size="11" fill="var(--mut)">'+t+'</text>'}
var last=d.length-1;[0,Math.floor(last/3),Math.floor(2*last/3),last].forEach(function(i){g+='<text x="'+pts[i][0]+'" y="'+(H-6)+'" font-size="11" fill="var(--mut)" text-anchor="middle">'+(i+1)+'</text>'});
document.getElementById('area').innerHTML='<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--s1)" stop-opacity=".35"/><stop offset="1" stop-color="var(--s1)" stop-opacity="0"/></linearGradient></defs>'+g+'<path d="'+line+' L'+pts[last][0]+' '+(H-p)+' L'+pts[0][0]+' '+(H-p)+'Z" fill="url(#gr)"/><path d="'+line+'" fill="none" stroke="var(--s1)" stroke-width="2.5"/>'}
function donut(sh){var src=[['Recherche Google','var(--s1)'],['Instagram','var(--s2)'],['Direct','var(--s3)'],['Autres sites','var(--s4)']];var a=-Math.PI/2,s='',L='';
src.forEach(function(x,i){var b=a+sh[i]/100*2*Math.PI,r=80,ri=52,c=100,l=sh[i]>50?1:0;
s+='<path d="M'+(c+r*Math.cos(a))+' '+(c+r*Math.sin(a))+' A'+r+' '+r+' 0 '+l+' 1 '+(c+r*Math.cos(b))+' '+(c+r*Math.sin(b))+' L'+(c+ri*Math.cos(b))+' '+(c+ri*Math.sin(b))+' A'+ri+' '+ri+' 0 '+l+' 0 '+(c+ri*Math.cos(a))+' '+(c+ri*Math.sin(a))+'Z" fill="'+x[1]+'" stroke="var(--card)" stroke-width="2"/>';
L+='<span><i style="background:'+x[1]+'"></i>'+x[0]+'<b>'+sh[i]+' %</b></span>';a=b});
document.getElementById('donut').innerHTML=s;document.getElementById('leg').innerHTML=L}
function bars(id,arr){var m=arr[0][1];document.getElementById(id).innerHTML=arr.map(function(x){return'<div class="bar"><span>'+x[0]+'</span><div class="t"><div style="width:'+(x[1]/m*100)+'%"></div></div><span>'+fmt(x[1])+'</span></div>'}).join('')}
function delta(v,p){if(p==null)return'';var dd=v-p;if(p>0&&v>=20){var pc=Math.round(dd/p*100);return(pc>=0?'+':'')+pc+' % vs mois précédent'}return(dd>=0?'+':'')+dd+' vs mois précédent'}
function show(m){var D=DATA[m],P=m>0?DATA[m-1]:null;
[[D.tot,P&&P.tot],[D.dem,P&&P.dem],[D.clics,P&&P.clics],[D.avis,P&&P.avis]].forEach(function(x,i){document.getElementById('k'+i).textContent=fmt(x[0]);document.getElementById('d'+i).textContent=delta(x[0],x[1])||'Premier mois suivi'});
area(D.d);donut(D.sh);
bars('pages',D.pw.map(function(v,i){return[PN[i],v]}));
bars('acts',[['Clics Demander un atelier',D.clics],['Clics Contact',D.ct],['Clics Événements',D.ev],['Demandes envoyées',D.dem],['Avis envoyés',D.avis]].sort(function(a,b){return b[1]-a[1]}))}
var sel=document.getElementById('mois');
MOIS.forEach(function(x,i){var o=document.createElement('option');o.value=i;o.textContent=x[0];sel.appendChild(o)});
sel.value=MOIS.length-1;sel.onchange=function(){show(+sel.value)};show(MOIS.length-1);
</script>

</body></html>
